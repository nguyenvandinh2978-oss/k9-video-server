<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>K9 tải MP4</title>
<style>body{font:17px system-ui;background:#101e32;color:#eff6ff;margin:auto;padding:24px;max-width:620px}h1{font-size:29px}input,select,button{box-sizing:border-box;font:inherit;padding:14px;border-radius:10px;border:1px solid #526780;margin:8px 0;width:100%}button{background:#38d5c5;color:#102037;font-weight:700;cursor:pointer}article{background:#21334e;padding:18px;border-radius:12px;margin:14px 0}a{color:#64edda}small{color:#bacade}#msg{white-space:pre-wrap}label.check{display:flex;align-items:center;gap:10px}input[type=checkbox]{width:24px}button.secondary{background:#bacade}</style>
<h1>K9 · Tải video MP4</h1><p>Dán link YouTube → tải về điện thoại.</p>
<section id="login"><label>Mã truy cập máy chủ<input id="key" type="password" autocomplete="current-password"></label><button id="sign">Kết nối</button><small>Lấy mã trong tệp data/access-key.txt trên máy Windows. Không gửi mã cho người khác.</small></section>
<section id="main" hidden><label>Link YouTube hoặc Shorts<input id="url" type="url" placeholder="https://www.youtube.com/shorts/…"></label><label>Chất lượng<select id="mode"><option value="fast">Nhanh · tối đa 720p, có thể là 360p</option><option value="sharp">Nét · tối đa 1080p, có thể chậm hơn</option></select></label><label class="check"><input type="checkbox" id="permitted">Tôi sở hữu hoặc được phép tải video này.</label><button id="go">Tải MP4</button><div id="jobs"></div><button class="secondary" id="out">Đăng xuất</button><small>Máy Windows phải bật và không ngủ. Chỉ hiện nút tải khi tệp đã được kiểm tra. Video giữ trên máy chủ cho đến khi anh xoá.</small></section><p id="msg" role="status"></p>
<script>
const el=id=>document.getElementById(id);let timer;
async function api(path,data){let r=await fetch(path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});let x=await r.json();if(!r.ok)throw Error(x.error||'Không kết nối được máy chủ');return x}
function say(s){el('msg').textContent=s}
async function refresh(){try{let x=await api('/status');el('login').hidden=true;el('main').hidden=false;el('go').disabled=x.busy;el('jobs').replaceChildren();for(let j of x.jobs.slice().reverse()){let a=document.createElement('article');let p=document.createElement('p');p.textContent=j.video_id+' · '+(j.state==='working'?'Đang tải và kiểm tra…':j.state==='error'?j.message:'Đã kiểm tra: '+j.width+' × '+j.height+' · '+Math.round(j.duration)+' giây · '+(j.bytes/1048576).toFixed(2)+' MiB · '+(j.audio?'Có tiếng':'Nguồn không có tiếng'));a.append(p);if(j.state==='done'){let link=document.createElement('a');link.href='/files/'+j.id;link.textContent='⬇ Tải MP4 về thiết bị';a.append(link)}el('jobs').append(a)}say('')}catch(e){say(e.message)}}
el('sign').onclick=async()=>{try{await api('/login',{key:el('key').value});el('key').value='';await refresh();clearInterval(timer);timer=setInterval(refresh,3000)}catch(e){say(e.message)}};
el('go').onclick=async()=>{try{await api('/jobs',{url:el('url').value.trim(),mode:el('mode').value,permitted:el('permitted').checked});await refresh()}catch(e){say(e.message)}};
el('out').onclick=async()=>{await api('/logout',{});clearInterval(timer);el('main').hidden=true;el('login').hidden=false;el('jobs').replaceChildren()};
refresh().then(()=>{timer=setInterval(()=>{if(!el('main').hidden)refresh()},3000)});
</script></html>
